name: Validate game runtime

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - mobile-chromium
    steps:
      - name: Check out current revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate JavaScript syntax
        run: |
          node --check game.js
          node --check poster-loader.js
          node --check mobile-enhancements.js
          node --check mobile-screen-state.js
          node --check mobile-question-state.js
          node --check mobile-native-answer.js
          node --check nabatick-directional.js
          node --check maze-enhancements.js
          node --check tests/game.spec.js

      - name: Run browser tests
        run: npm run test:smoke -- --project=${{ matrix.project }}

      - name: Verify clean patch formatting
        run: git diff --check
